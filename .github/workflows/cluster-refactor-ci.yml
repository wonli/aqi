name: cluster-refactor-ci

on:
  push:
    branches:
      - feature/cluster-pubsub

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Format
        run: test -z "$(gofmt -l ws/cluster*.go ws/pubsub.go ws/pubsub_topic.go ws/user.go)"
      - name: Vet ws
        run: go vet ./ws
      - name: Test ws
        run: go test ./ws -count=1
      - name: Race ws
        run: go test -race ./ws -count=1
