name: cluster-refactor-ci

on:
  push:
    branches:
      - feature/cluster-pubsub

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Format
        run: test -z "$(gofmt -l app.go options.go cluster_option_test.go cluster_public_api_test.go ws/cluster*.go ws/hubc.go ws/hubc_lifecycle_test.go ws/pubsub.go ws/pubsub_topic.go ws/user.go)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -count=1
      - name: Race
        run: go test -race ./... -count=1
