name: cluster-ci

on:
  push:
    branches:
      - feature/cluster-pubsub

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Format
        run: |
          files=(
            ws/cluster.go
            ws/cluster_delivery_test.go
            ws/cluster_topic_test.go
            ws/cluster_user_test.go
            ws/hubc.go
            ws/pubsub.go
            ws/user.go
          )
          unformatted="$(gofmt -l "${files[@]}")"
          test -z "$unformatted" || { echo "Unformatted files:"; echo "$unformatted"; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -count=1
      - name: Race
        run: go test -race ./... -count=1
